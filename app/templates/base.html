<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}QuoteLoop{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','ui-sans-serif','system-ui']},colors:{brand:{50:'#eef4ff',100:'#dbe6fe',500:'#3b6cf6',600:'#2a56e0',700:'#2145b8'}}}}}</script>
<style>body{-webkit-font-smoothing:antialiased} .num{font-variant-numeric:tabular-nums}</style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">
{% block nav %}{% endblock %}
<main class="{% block mainclass %}max-w-6xl mx-auto px-4 sm:px-6 py-8{% endblock %}">{% block body %}{% endblock %}</main>
<footer class="max-w-6xl mx-auto px-4 sm:px-6 pb-10 text-xs text-slate-400">QuoteLoop · No AI runs inside this app. The buyer's own Claude connects through MCP. {% block footer %}{% endblock %}</footer>
</body></html>
