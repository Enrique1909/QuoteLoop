<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}QuoteLoop{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','ui-sans-serif','system-ui']},colors:{brand:{50:'#eaf6f7',100:'#B9E4E8',200:'#94d3da',500:'#1d93a5',600:'#167D8D',700:'#106270',800:'#0c3e4a',900:'#071B2B'}}}}}</script>
<style>body{-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"} .num{font-variant-numeric:tabular-nums} details>summary::-webkit-details-marker{display:none}</style>
</head>
<body class="bg-[#EEEEEE] text-slate-800 font-sans min-h-screen text-[14px]">
{% block nav %}{% endblock %}
<main class="{% block mainclass %}max-w-6xl mx-auto px-4 sm:px-6 py-7{% endblock %}">{% block body %}{% endblock %}</main>
<footer class="max-w-6xl mx-auto px-4 sm:px-6 pb-10 text-xs text-slate-400">QuoteLoop · No AI runs inside this application. AI features use the customer's own Claude via MCP. {% block footer %}{% endblock %}</footer>
</body></html>
