{% extends "base.html" %}
{% block body %}
<article style="max-width:420px;margin:3rem auto">
<h2>Agency login</h2>
{% if error %}<p style="color:#b91c1c">{{ error }}</p>{% endif %}
<form method="post" action="/login">
 <label>Email<input name="email" type="email" value="{{ demo_email }}" required></label>
 <label>Password<input name="password" type="password" required></label>
 <button type="submit">Log in</button>
</form>
</article>
{% endblock %}
