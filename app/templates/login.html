{% extends "base.html" %}
{% from "macros.html" import input, btn %}
{% block body %}
<div class="max-w-sm mx-auto mt-16 bg-white rounded-2xl shadow-sm ring-1 ring-slate-200 p-8">
 <div class="flex items-center gap-2 font-bold mb-6"><span class="grid place-items-center h-7 w-7 rounded-lg bg-brand-600 text-white text-xs">QL</span>QuoteLoop</div>
 <h2 class="text-xl font-semibold">Buyer login</h2>
 {% if error %}<p class="mt-3 text-sm text-rose-600">{{ error }}</p>{% endif %}
 <form method="post" action="/login" class="mt-5 space-y-4">
  <label class="block text-sm font-medium">Email<input name="email" type="email" value="{{ demo_email }}" required class="mt-1 {{ input() }}"></label>
  <label class="block text-sm font-medium">Password<input name="password" type="password" required class="mt-1 {{ input() }}"></label>
  <button class="w-full {{ btn('bg-brand-600 text-white hover:bg-brand-700') }}">Log in</button>
 </form>
</div>
{% endblock %}
